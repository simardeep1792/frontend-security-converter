---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-gemma
  namespace: security-converter
  labels:
    app.kubernetes.io/name: security-converter
    app.kubernetes.io/component: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-gemma
  template:
    metadata:
      labels:
        app: ollama-gemma
        app.kubernetes.io/name: security-converter
        app.kubernetes.io/component: llm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: ollama-gemma-container
        image: ollama/ollama:0.12.10
        resources:
          requests:
            cpu: "8"
            memory: "16Gi"
            ephemeral-storage: "10Gi"
          limits:
            cpu: "16"
            memory: "32Gi"
            ephemeral-storage: "20Gi"
        command: ["/bin/bash", "-c"]
        args:
        - |
          ollama serve &
          OLLAMA_PID=$!
          echo "Waiting for Ollama server to start..."
          sleep 5
          echo "Pulling Llama3 model..."
          ollama pull llama3:8b
          echo "Model pulled. Ready to serve."
          wait $OLLAMA_PID
        ports:
        - containerPort: 11434
          name: ollama
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: security-converter
  labels:
    app.kubernetes.io/name: security-converter
    app.kubernetes.io/component: llm
spec:
  type: ClusterIP
  selector:
    app: ollama-gemma
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 11434
    name: ollama