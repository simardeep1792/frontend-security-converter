mutation SubmitConversion($input: SubmitConversionRequestInput!) {
  submitConversionRequest(input: $input) {
    id
    sourceNationCode
    targetNationCodes
    createdAt
    dataObject {
      id
      title
      description
    }
    authority {
      id
      name
      nation {
        nationCode
        nationName
      }
    }
  }
}