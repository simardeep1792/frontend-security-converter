{% extends "base.html" %}

{% block content %}
<div class="col m-md-2 m-1">
    <div class="mb-4">
        <h1 class="display-5 mb-1">Conversion Request Error</h1>
    </div>

    <div class="alert alert-danger shadow-sm" role="alert">
        <h4 class="alert-heading"><i class="bi bi-exclamation-triangle-fill"></i> Submission Failed</h4>
        <p>{{ error }}</p>
        <hr>
        <p class="mb-0">The conversion request could not be processed. This may be due to the API not supporting this operation yet.</p>
    </div>

    <div class="d-grid gap-2 mb-4">
        <a href="/{{ lang }}/conversion_request" class="btn btn-primary btn-lg shadow">
            <i class="bi bi-arrow-left"></i> Back to Conversion Request
        </a>
        <a href="/{{ lang }}" class="btn btn-secondary btn-lg shadow">
            <i class="bi bi-house"></i> Return Home
        </a>
    </div>
</div>
{% endblock content %}
